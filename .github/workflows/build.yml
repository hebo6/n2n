name: build

on:
  push:
    branches: [ "dev" ]

jobs:
  build-linux_x64:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: setup env
        run: sudo apt-get install -y libcap-dev libssl-dev libminiupnpc-dev libnatpmp-dev libzstd-dev

      - name: make
        run: |
          ./autogen.sh
          ./configure --with-zstd --with-openssl --enable-miniupnp --enable-natpmp --enable-cap --enable-pthread CFLAGS="-DSKIP_MULTICAST_PEERS_DISCOVERY"
          make

      - name: collect files
        run: |
          mv tools/n2n-benchmark tools/n2n-portfwd ./
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: n2n_linux_x64
          path: |
            edge
            supernode
            n2n-benchmark
            n2n-portfwd
          if-no-files-found: error

  build-linux_aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: setup env
        run: |
          sudo sed -i 's/^deb/deb [arch=amd64]/g' /etc/apt/sources.list
          echo '
          deb [arch=arm64] http://ports.ubuntu.com/ '$(lsb_release -cs)' main multiverse universe
          deb [arch=arm64] http://ports.ubuntu.com/ '$(lsb_release -cs)'-security main multiverse universe
          deb [arch=arm64] http://ports.ubuntu.com/ '$(lsb_release -cs)'-backports main multiverse universe
          deb [arch=arm64] http://ports.ubuntu.com/ '$(lsb_release -cs)'-updates main multiverse universe
          ' | sudo tee -a /etc/apt/sources.list
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt-get install -y libcap-dev:arm64 libssl-dev:arm64 libminiupnpc-dev:arm64 libnatpmp-dev:arm64 libzstd-dev:arm64

      - name: make
        run: |
          HOST_TRIPLET=aarch64-linux-gnu
          sudo apt-get install -y binutils-$HOST_TRIPLET gcc-$HOST_TRIPLET
          ./autogen.sh
          ./configure --host $HOST_TRIPLET --with-zstd --with-openssl --enable-miniupnp --enable-natpmp --enable-cap --enable-pthread CFLAGS="-DSKIP_MULTICAST_PEERS_DISCOVERY"
          make

      - name: collect files
        run: |
          mv tools/n2n-benchmark tools/n2n-portfwd ./
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: n2n_linux_aarch64
          path: |
            edge
            supernode
            n2n-benchmark
            n2n-portfwd
          if-no-files-found: error

  build-windows_x64:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: setup env libssl
        run: |
          curl https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.4.0.zip -o openssl.zip
          unzip openssl.zip -d openssl
          sudo mkdir /usr/x86_64-w64-mingw32
          sudo mv openssl/x64/* /usr/x86_64-w64-mingw32/

      - name: make
        run: |
          HOST_TRIPLET=mingw-w64-x86-64
          sudo apt-get install -y binutils-$HOST_TRIPLET gcc-$HOST_TRIPLET
          ./autogen.sh
          #./configure --host x86_64-w64-mingw32 --with-zstd --with-openssl --enable-miniupnp --enable-natpmp --enable-cap --enable-pthread CFLAGS="-DSKIP_MULTICAST_PEERS_DISCOVERY"
          # fixme adding "--with-openssl" will cause segmentation fault when run "edge.exe -k xxx"
          ./configure --host x86_64-w64-mingw32 CFLAGS="-DSKIP_MULTICAST_PEERS_DISCOVERY"
          make

      - name: collect files
        run: |
          cp /usr/x86_64-w64-mingw32/bin/libcrypto-3-x64.dll ./
          cp /usr/x86_64-w64-mingw32/bin/libssl-3-x64.dll ./
          mv tools/n2n-benchmark.exe tools/n2n-portfwd.exe ./
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: n2n_windows_x64
          path: |
            edge.exe
            supernode.exe
            n2n-benchmark.exe
            n2n-portfwd.exe
            libcrypto-3-x64.dll
            libssl-3-x64.dll
          if-no-files-found: error
